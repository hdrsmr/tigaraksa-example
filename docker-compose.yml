services:

  # =====================================================
  # SQL SERVER
  # =====================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "chickhenR2#"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped


  # =====================================================
  # HAZELCAST
  # =====================================================
  hazelcast:
    image: hazelcast/hazelcast:5.6
    container_name: hazelcast
    ports:
      - "5701:5701"
    environment:
      HZ_CLUSTERNAME: dev
    restart: unless-stopped


  # =====================================================
  # HAZELCAST MANAGEMENT CENTER
  # =====================================================
  management-center:
    image: hazelcast/management-center:5.6
    container_name: hazelcast-management-center
    ports:
      - "7070:8080"
    environment:
      MC_DEFAULT_CLUSTER: dev
      MC_DEFAULT_CLUSTER_MEMBERS: hazelcast:5701
    depends_on:
      - hazelcast
    restart: unless-stopped


# =====================================================
# VOLUMES
# =====================================================
volumes:
  sqlserver_data: